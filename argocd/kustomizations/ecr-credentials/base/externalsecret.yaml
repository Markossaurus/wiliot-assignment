# Renders an Argo CD repository Secret from a fresh ECR token. Tokens last 12 hours, so it
# refreshes well before expiry.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ecr-charts
spec:
  refreshInterval: 6h
  target:
    name: repo-ecr-charts
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        name: ecr-charts
        type: helm
        enableOCI: "true"
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ECRAuthorizationToken
          name: ecr-charts
