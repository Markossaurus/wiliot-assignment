# Argo CD manages itself. The bootstrap installs the chart and values declared here, so the
# hand-over is a no-op; the ECR credentials need External Secrets, hence the later wave.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.11.6
      helm:
        releaseName: argocd
        valueFiles:
          - $values/argocd/prod/values/argocd.yaml
    - repoURL: https://github.com/Markossaurus/wiliot-assignment.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/Markossaurus/wiliot-assignment.git
      targetRevision: main
      path: argocd/kustomizations/ecr-credentials/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      # A bad commit must never be able to delete Argo CD itself.
      prune: false
      selfHeal: true
    syncOptions:
      # Required when Argo CD manages itself: its CRDs are too large for client-side apply.
      - ServerSideApply=true
