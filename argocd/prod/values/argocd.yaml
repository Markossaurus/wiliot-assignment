# No SSO: the UI is never exposed outside the cluster.
dex:
  enabled: false

configs:
  cm:
    # Restores health assessment of Application resources, so sync waves in the root
    # Application wait for each child Application to become healthy. Health only: root is one of
    # its own resources, so a check on the sync phase would make root wait for its own sync.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs
