{{- $ctx := dict "name" "producer" "root" . }}
# Reads the SSM parameters with the producer's own IRSA role and keeps them in a Secret that the
# pods mount as files.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: producer
  labels:
    {{- include "producer.labels" $ctx | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{ required "awsRegion is required" .Values.awsRegion }}
      auth:
        jwt:
          serviceAccountRef:
            name: producer
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: producer
  labels:
    {{- include "producer.labels" $ctx | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: producer
  target:
    name: producer-config
  data:
    - secretKey: kafka-bootstrap-servers
      remoteRef:
        key: {{ required "parameters.kafkaBootstrapServers is required" .Values.parameters.kafkaBootstrapServers }}
