apiVersion: v1
kind: ServiceAccount
metadata:
  name: producer
  labels:
    {{- include "producer.labels" (dict "name" "producer" "root" .) | nindent 4 }}
  annotations:
    # Created before the Deployment that runs as it.
    argocd.argoproj.io/sync-wave: "-1"
    eks.amazonaws.com/role-arn: {{ required "roleArn is required" .Values.roleArn }}
