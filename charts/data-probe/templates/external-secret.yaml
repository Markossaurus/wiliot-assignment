{{- $ctx := dict "name" "data-probe" "root" . }}
# Reads the SSM parameters with the probe's own IRSA role and keeps them in a Secret that the pod
# mounts as files.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: data-probe
  labels:
    {{- include "data-probe.labels" $ctx | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{ required "awsRegion is required" .Values.awsRegion }}
      auth:
        jwt:
          serviceAccountRef:
            name: data-probe
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: data-probe
  labels:
    {{- include "data-probe.labels" $ctx | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: data-probe
  target:
    name: data-probe-config
  data:
    {{- range $key, $parameter := dict
      "db-host" .Values.parameters.dbAddress
      "db-port" .Values.parameters.dbPort
      "db-name" .Values.parameters.dbName }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ required (printf "the SSM parameter for %s is required" $key) $parameter }}
    {{- end }}
