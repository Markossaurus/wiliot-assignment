apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-bootstrap
  labels:
    {{- include "database.labels" (dict "name" "db-bootstrap" "root" .) | nindent 4 }}
  annotations:
    # Created before the migration Job that runs as it.
    argocd.argoproj.io/sync-wave: "-2"
    eks.amazonaws.com/role-arn: {{ required "roleArn is required" .Values.roleArn }}
