{{- $ctx := dict "name" "consumer" "root" . }}
# Reads the SSM parameters with the consumer's own IRSA role and keeps them in a Secret that the
# pods mount as files.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: consumer
  labels:
    {{- include "consumer.labels" $ctx | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{ required "awsRegion is required" .Values.awsRegion }}
      auth:
        jwt:
          serviceAccountRef:
            name: consumer
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: consumer
  labels:
    {{- include "consumer.labels" $ctx | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: consumer
  target:
    name: consumer-config
  data:
    {{- range $key, $parameter := dict
      "kafka-bootstrap-servers" .Values.parameters.kafkaBootstrapServers
      "db-host" .Values.parameters.dbAddress
      "db-port" .Values.parameters.dbPort
      "db-name" .Values.parameters.dbName }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ required (printf "the SSM parameter for %s is required" $key) $parameter }}
    {{- end }}
