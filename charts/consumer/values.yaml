# Region of the MSK cluster, RDS instance and SSM parameters.
awsRegion: ""

# Used only when autoscaling is off.
replicas: 3

# KEDA scales on the consumer group's lag. Each partition has one consumer at most, so more replicas
# than partitions would sit idle.
autoscaling:
  enabled: true
  # One per zone.
  minReplicas: 3
  # The topic's partition count.
  maxReplicas: 6
  # Target lag per replica, in messages.
  lagThreshold: 500

image:
  repository: ""
  tag: ""

# IRSA role of the service account; External Secrets reads the SSM parameters with it too.
roleArn: ""

kafka:
  topic: binance.trades
  consumerGroup: trades-writer

# SSM parameters that External Secrets copies into the namespace.
parameters:
  kafkaBootstrapServers: ""
  dbAddress: ""
  dbPort: ""
  dbName: ""

database:
  # User the consumer connects as with IAM authentication; the database chart creates it.
  writerUser: trades_writer

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
